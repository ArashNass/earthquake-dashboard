# GitHub disables scheduled workflows in a public repo after 60 days without
# repository activity, which silently freezes the hourly dashboard rebuild.
# This pushes an empty commit once a month so that never happens.

name: Keepalive

on:
  schedule:
    - cron: "17 3 1 * *"   # 03:17 UTC on the 1st of every month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Push an empty commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: monthly keepalive"
          git push
